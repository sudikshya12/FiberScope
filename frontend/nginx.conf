server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8077;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # server-sent events
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /docs { proxy_pass http://api:8077; }
  location /openapi.json { proxy_pass http://api:8077; }
  location / { try_files $uri /index.html; }
}

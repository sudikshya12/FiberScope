[project]
name = "fiberscope-backend"
version = "0.1.0"
description = "FiberScope — Network & Fiber Troubleshooting Lab (API, simulation engine, evidence store)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.162,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.14,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
